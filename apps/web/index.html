<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The Persimmon wordmark set, rendered by scripts/make-web-icons.mjs.
         The old logo-icon-* files were the retired gift-box-and-bow mark and
         are deleted, not merely unreferenced — a file that exists is a file
         something can still find. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#F94E33" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Jost 600 is used by the inline brand logo only (components/BrandLogo.tsx);
         the site's font stack is unchanged. SELF-HOSTED on purpose: the
         production CSP allows font-src 'self' only, so a Google Fonts link
         would be silently blocked live and the wordmark would fall back to
         the wrong font — the exact failure the brand spec warns about. -->
    <style>
      @font-face {
        font-family: "Jost";
        font-weight: 600;
        font-display: swap;
        src: url("/brand/jost-600.woff2") format("woff2");
      }
    </style>
    <title>CADO — Gifts, Delivered</title>
    <meta name="description" content="CADO is Lebanon's gift marketplace — flowers, fashion, jewelry, beauty, kids, and chocolate gifts from your favorite local stores, delivered." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
