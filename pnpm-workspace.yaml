packages:
  - "apps/*"
  - "packages/*"
# Dependencies allowed to run install scripts. pnpm 10 refuses to run them
# unless they are listed true here, and on EAS Build that refusal is a hard
# failure (ERR_PNPM_IGNORED_BUILDS) reported only as "Unknown error" — it
# failed two Android builds. sharp is not a mobile dependency; it arrived
# transitively with Next.js when apps/dashboard was added.
#
# `sharp` was left as the literal placeholder text pnpm writes when it cannot
# prompt, which is not a boolean and so never granted anything.
allowBuilds:
  esbuild: true
  sharp: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.11'
  - '@expo/inline-modules@0.1.4'
  - '@expo/local-build-cache-provider@57.0.5'
  - '@expo/log-box@57.0.2'
  - '@expo/prebuild-config@57.0.10'
  - babel-preset-expo@57.0.5
  - expo-asset@57.0.8
  - expo-constants@57.0.8
  - expo-modules-core@57.0.8
  - expo@57.0.9
  - vite@8.2.0
  - '@expo/metro-runtime@57.0.8'
  - '@expo/ui@57.0.8'
  - expo-router@57.0.9
